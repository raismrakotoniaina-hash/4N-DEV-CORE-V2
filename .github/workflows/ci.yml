name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d core_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/core_test
      DB_SSL: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Run billing unit tests
        run: npm test
      - name: Validate all PostgreSQL migrations on a clean database
        run: npm run db:migrate
      - name: Check backend JavaScript syntax
        run: |
          find server -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check deployment shell syntax
        run: |
          bash -n deploy/scripts/*.sh
